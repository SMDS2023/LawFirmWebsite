<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Dashboard - Spanish Tutor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-container">
    <!-- Header -->
    <header class="admin-header">
      <h1>Parent Dashboard</h1>
      <p>Monitor progress and manage settings</p>
    </header>

    <!-- Progress Stats -->
    <div class="admin-card">
      <h3>Progress Overview</h3>
      <div class="stat-grid">
        <div class="stat-item">
          <div class="stat-value" id="stat-streak">-</div>
          <div class="stat-label">Day Streak</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-today">-</div>
          <div class="stat-label">Minutes Today</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-total">-</div>
          <div class="stat-label">Total Minutes</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-lessons">-</div>
          <div class="stat-label">Lessons Completed</div>
        </div>
      </div>

      <div style="margin-top: 1rem;">
        <strong>Current Lesson:</strong> <span id="current-lesson">-</span><br>
        <strong>Vocabulary Learned:</strong> <span id="vocab-count">-</span> words<br>
        <strong>Last Practice:</strong> <span id="last-practice">-</span>
      </div>
    </div>

    <!-- Unlock Status -->
    <div class="admin-card">
      <h3>Today's Unlock Status</h3>
      <div id="unlock-status" style="text-align: center; padding: 2rem;">
        <p>Loading...</p>
      </div>
    </div>

    <!-- Settings -->
    <div class="admin-card">
      <h3>Settings</h3>
      <div class="admin-controls">
        <div class="control-group">
          <label for="daily-goal">Daily Goal (minutes): <span id="goal-display">15</span></label>
          <input type="range" id="daily-goal" min="5" max="60" value="15" step="5">
          <button onclick="updateDailyGoal()">Save Goal</button>
        </div>

        <div class="control-group" style="margin-top: 1rem;">
          <label>Emergency Access</label>
          <button onclick="adminOverride()" style="background: var(--accent);">Generate Override Code</button>
          <div id="override-result" style="margin-top: 0.5rem; text-align: center;"></div>
        </div>

        <div class="control-group" style="margin-top: 1rem;">
          <label>Reset Progress (Caution!)</label>
          <button onclick="confirmReset()" style="background: var(--danger);">Reset All Progress</button>
        </div>
      </div>
    </div>

    <!-- Back to Lessons -->
    <div style="text-align: center; margin-top: 2rem;">
      <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">
        ← Back to Lessons
      </a>
    </div>
  </div>

  <script src="js/progress.js"></script>
  <script src="js/unlock.js"></script>
  <script>
    const progressManager = new ProgressManager();
    const unlockManager = new UnlockManager();

    // Load progress stats
    function loadStats() {
      const progress = progressManager.getProgress();

      document.getElementById('stat-streak').textContent = progress.streak;
      document.getElementById('stat-today').textContent = progress.dailyMinutes;
      document.getElementById('stat-total').textContent = progress.totalMinutes;
      document.getElementById('stat-lessons').textContent = progress.completedLessons.length;
      document.getElementById('current-lesson').textContent = `Lesson ${progress.currentLesson}`;
      document.getElementById('vocab-count').textContent = progressManager.getTotalVocabulary();
      document.getElementById('last-practice').textContent = progress.lastPractice;

      // Update daily goal slider
      document.getElementById('daily-goal').value = progress.dailyGoal;
      document.getElementById('goal-display').textContent = progress.dailyGoal;

      // Update unlock status
      updateUnlockStatus(progress);
    }

    function updateUnlockStatus(progress) {
      const container = document.getElementById('unlock-status');

      if (progress.unlockCode) {
        container.innerHTML = `
          <div class="unlock-achieved">
            <p><strong>✓ Goal Met!</strong></p>
            <div class="code-display">${progress.unlockCode}</div>
            <p class="code-note">Code valid until midnight</p>
          </div>
        `;
      } else {
        const remaining = progress.dailyGoal - progress.dailyMinutes;
        container.innerHTML = `
          <p style="font-size: 1.25rem; color: #6b7280;">
            ${remaining} minutes remaining until unlock
          </p>
          <div style="width: 100%; background: var(--border); height: 1rem; border-radius: 0.5rem; margin-top: 1rem;">
            <div style="width: ${(progress.dailyMinutes / progress.dailyGoal * 100)}%; background: var(--primary); height: 100%; border-radius: 0.5rem;"></div>
          </div>
        `;
      }
    }

    // Update daily goal slider display
    document.getElementById('daily-goal').addEventListener('input', (e) => {
      document.getElementById('goal-display').textContent = e.target.value;
    });

    function updateDailyGoal() {
      const newGoal = parseInt(document.getElementById('daily-goal').value);
      progressManager.setDailyGoal(newGoal);
      unlockManager.setDailyGoal(newGoal);
      alert(`Daily goal updated to ${newGoal} minutes`);
      loadStats();
    }

    function adminOverride() {
      const code = progressManager.adminUnlock();
      const result = document.getElementById('override-result');
      result.innerHTML = `
        <div class="unlock-achieved" style="margin: 0;">
          <p><strong>Emergency Override Code</strong></p>
          <div class="code-display" style="font-size: 2rem; margin: 0.5rem 0;">${code}</div>
          <p class="code-note">Valid until midnight</p>
        </div>
      `;
    }

    function confirmReset() {
      if (confirm('Are you sure you want to reset ALL progress? This cannot be undone.')) {
        if (confirm('Really delete all progress? Streak, completed lessons, and time will be lost.')) {
          progressManager.reset();
          alert('Progress has been reset');
          loadStats();
        }
      }
    }

    // Load stats on page load
    loadStats();

    // Refresh every 10 seconds
    setInterval(loadStats, 10000);
  </script>
</body>
</html>

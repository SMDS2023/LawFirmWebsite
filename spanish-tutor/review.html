<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish Tutor - Lesson Review</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #2d3748;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: white;
      font-size: 2.5rem;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .lesson-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .lesson-header {
      border-bottom: 3px solid #667eea;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .lesson-title {
      font-size: 1.8rem;
      color: #667eea;
      margin-bottom: 5px;
    }

    .lesson-subtitle {
      color: #718096;
      font-size: 0.9rem;
    }

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 1.3rem;
      color: #2d3748;
      margin-bottom: 15px;
      border-left: 4px solid #764ba2;
      padding-left: 12px;
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .vocab-item, .phrase-item {
      background: #f7fafc;
      border-radius: 8px;
      padding: 15px;
      border: 2px solid #e2e8f0;
      transition: all 0.3s ease;
    }

    .vocab-item:hover, .phrase-item:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
    }

    .spanish-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 5px;
    }

    .english-text {
      font-size: 0.95rem;
      color: #718096;
    }

    .audio-button {
      background: #764ba2;
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .audio-button:hover {
      background: #667eea;
      transform: scale(1.1);
    }

    .audio-button:active {
      transform: scale(0.95);
    }

    .dialogue-line {
      background: #f7fafc;
      border-left: 4px solid #764ba2;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 4px;
    }

    .dialogue-speaker {
      font-weight: 700;
      color: #764ba2;
      font-size: 0.85rem;
      margin-bottom: 5px;
    }

    .quiz-question {
      background: #fff5f7;
      border: 2px solid #fc8181;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .quiz-question-text {
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 12px;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quiz-option {
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quiz-option:hover {
      border-color: #fc8181;
      background: #fff5f7;
    }

    .quiz-option.correct {
      background: #c6f6d5;
      border-color: #48bb78;
      font-weight: 600;
    }

    .context-note {
      background: #fefcbf;
      border-left: 4px solid #ecc94b;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 4px;
      font-style: italic;
      color: #744210;
    }

    @media (max-width: 768px) {
      .vocab-grid {
        grid-template-columns: 1fr;
      }

      .lesson-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎾 Spanish Tutor - Pickleball Edition</h1>

    <div id="lessons-container"></div>
  </div>

  <script>
    // Lesson data embedded
    const lessons = [
      {
        "id": 1,
        "title": "Numbers 0-15: Pickleball Scoring",
        "theme": "pickleball",
        "vocabulary": [
          {"spanish": "cero", "english": "zero", "audio": "audio/01-cero.mp3"},
          {"spanish": "uno", "english": "one", "audio": "audio/01-uno.mp3"},
          {"spanish": "dos", "english": "two", "audio": "audio/01-dos.mp3"},
          {"spanish": "tres", "english": "three", "audio": "audio/01-tres.mp3"},
          {"spanish": "cuatro", "english": "four", "audio": "audio/01-cuatro.mp3"},
          {"spanish": "cinco", "english": "five", "audio": "audio/01-cinco.mp3"},
          {"spanish": "seis", "english": "six", "audio": "audio/01-seis.mp3"},
          {"spanish": "siete", "english": "seven", "audio": "audio/01-siete.mp3"},
          {"spanish": "ocho", "english": "eight", "audio": "audio/01-ocho.mp3"},
          {"spanish": "nueve", "english": "nine", "audio": "audio/01-nueve.mp3"},
          {"spanish": "diez", "english": "ten", "audio": "audio/01-diez.mp3"},
          {"spanish": "once", "english": "eleven", "audio": "audio/01-once.mp3"}
        ],
        "phrases": [
          {"spanish": "Cero-cero, servicio", "english": "Zero-zero, serve", "audio": "audio/01-phrase-1.mp3"},
          {"spanish": "Tres-dos-uno", "english": "Three-two-one (score announcement)", "audio": "audio/01-phrase-2.mp3"},
          {"spanish": "Cinco-cuatro-dos", "english": "Five-four-two (score announcement)", "audio": "audio/01-phrase-3.mp3"},
          {"spanish": "Diez-nueve-uno", "english": "Ten-nine-one (score announcement)", "audio": "audio/01-phrase-4.mp3"},
          {"spanish": "¿Cuál es el marcador?", "english": "What's the score?", "audio": "audio/01-phrase-5.mp3"}
        ],
        "dialogue": {
          "context": "Starting a pickleball game",
          "lines": [
            {"speaker": "A", "spanish": "¿Listo para jugar?", "english": "Ready to play?"},
            {"speaker": "B", "spanish": "Sí, estoy listo.", "english": "Yes, I'm ready."},
            {"speaker": "A", "spanish": "Cero-cero, servicio.", "english": "Zero-zero, serve."},
            {"speaker": "B", "spanish": "¡Vamos!", "english": "Let's go!"},
            {"speaker": "A", "spanish": "Uno-cero-uno.", "english": "One-zero-one."},
            {"speaker": "B", "spanish": "¿Cuál es el marcador ahora?", "english": "What's the score now?"},
            {"speaker": "A", "spanish": "Dos-uno-dos.", "english": "Two-one-two."}
          ]
        },
        "quiz": [
          {"question": "How do you say 'zero' in Spanish?", "options": ["cero", "uno", "dos"], "correct": 0},
          {"question": "What does 'cinco' mean?", "options": ["four", "five", "six"], "correct": 1},
          {"question": "How would you announce the score 3-2-1?", "options": ["Dos-tres-uno", "Tres-dos-uno", "Uno-dos-tres"], "correct": 1},
          {"question": "What does '¿Cuál es el marcador?' mean?", "options": ["Let's play", "What's the score?", "Your serve"], "correct": 1},
          {"question": "How do you say 'ten' in Spanish?", "options": ["nueve", "diez", "once"], "correct": 1}
        ]
      },
      {
        "id": 2,
        "title": "Basic Court Phrases",
        "theme": "pickleball",
        "vocabulary": [
          {"spanish": "Buen tiro", "english": "Nice shot", "audio": "audio/02-buen-tiro.mp3"},
          {"spanish": "Vamos", "english": "Let's go / Come on", "audio": "audio/02-vamos.mp3"},
          {"spanish": "Mi servicio", "english": "My serve", "audio": "audio/02-mi-servicio.mp3"},
          {"spanish": "Fuera", "english": "Out", "audio": "audio/02-fuera.mp3"},
          {"spanish": "Dentro", "english": "In", "audio": "audio/02-dentro.mp3"},
          {"spanish": "Punto", "english": "Point", "audio": "audio/02-punto.mp3"},
          {"spanish": "Cambiar", "english": "Switch / Change", "audio": "audio/02-cambiar.mp3"},
          {"spanish": "Listo", "english": "Ready (masculine)", "audio": "audio/02-listo.mp3"},
          {"spanish": "Lista", "english": "Ready (feminine)", "audio": "audio/02-lista.mp3"},
          {"spanish": "Jugar", "english": "To play", "audio": "audio/02-jugar.mp3"}
        ],
        "phrases": [
          {"spanish": "¡Buen tiro!", "english": "Nice shot!", "audio": "audio/02-phrase-1.mp3"},
          {"spanish": "Es mi servicio", "english": "It's my serve", "audio": "audio/02-phrase-2.mp3"},
          {"spanish": "¿Listo para jugar?", "english": "Ready to play?", "audio": "audio/02-phrase-3.mp3"},
          {"spanish": "La pelota está fuera", "english": "The ball is out", "audio": "audio/02-phrase-4.mp3"},
          {"spanish": "¡Vamos a jugar!", "english": "Let's play!", "audio": "audio/02-phrase-5.mp3"},
          {"spanish": "Es tu punto", "english": "It's your point", "audio": "audio/02-phrase-6.mp3"}
        ],
        "dialogue": {
          "context": "Playing a game and calling shots",
          "lines": [
            {"speaker": "A", "spanish": "¿Estás listo?", "english": "Are you ready?"},
            {"speaker": "B", "spanish": "Sí, estoy listo. Es mi servicio.", "english": "Yes, I'm ready. It's my serve."},
            {"speaker": "A", "spanish": "¡Vamos!", "english": "Let's go!"},
            {"speaker": "B", "spanish": "Cero-cero, servicio.", "english": "Zero-zero, serve."},
            {"speaker": "A", "spanish": "¡Fuera!", "english": "Out!"},
            {"speaker": "B", "spanish": "No, está dentro.", "english": "No, it's in."},
            {"speaker": "A", "spanish": "Tienes razón. Es tu punto.", "english": "You're right. It's your point."},
            {"speaker": "B", "spanish": "¡Buen tiro!", "english": "Nice shot!"},
            {"speaker": "A", "spanish": "Gracias. Vamos a cambiar de lado.", "english": "Thanks. Let's switch sides."}
          ]
        },
        "quiz": [
          {"question": "How do you say 'nice shot' in Spanish?", "options": ["Buen día", "Buen tiro", "Buen punto"], "correct": 1},
          {"question": "What does 'fuera' mean?", "options": ["In", "Out", "Point"], "correct": 1},
          {"question": "How would you say 'It's my serve'?", "options": ["Es mi punto", "Es mi servicio", "Mi tiro"], "correct": 1},
          {"question": "What does '¿Listo?' mean?", "options": ["Let's go?", "Ready?", "Your turn?"], "correct": 1},
          {"question": "How do you say 'Let's play'?", "options": ["Vamos a jugar", "Jugar vamos", "A jugar"], "correct": 0}
        ]
      },
      {
        "id": 3,
        "title": "Game Vocabulary",
        "theme": "pickleball",
        "vocabulary": [
          {"spanish": "Servir", "english": "To serve", "audio": "audio/03-servir.mp3"},
          {"spanish": "Devolver", "english": "To return", "audio": "audio/03-devolver.mp3"},
          {"spanish": "Volea", "english": "Volley", "audio": "audio/03-volea.mp3"},
          {"spanish": "La cocina", "english": "Kitchen (no-volley zone)", "audio": "audio/03-la-cocina.mp3"},
          {"spanish": "Raqueta", "english": "Paddle", "audio": "audio/03-raqueta.mp3"},
          {"spanish": "Pelota", "english": "Ball", "audio": "audio/03-pelota.mp3"},
          {"spanish": "Red", "english": "Net", "audio": "audio/03-red.mp3"},
          {"spanish": "Cancha", "english": "Court", "audio": "audio/03-cancha.mp3"},
          {"spanish": "Partido", "english": "Match / Game", "audio": "audio/03-partido.mp3"},
          {"spanish": "Equipo", "english": "Team", "audio": "audio/03-equipo.mp3"},
          {"spanish": "Pareja", "english": "Partner", "audio": "audio/03-pareja.mp3"},
          {"spanish": "Oponente", "english": "Opponent", "audio": "audio/03-oponente.mp3"}
        ],
        "phrases": [
          {"spanish": "No puedes jugar en la cocina", "english": "You can't play in the kitchen", "audio": "audio/03-phrase-1.mp3"},
          {"spanish": "Es mi pareja", "english": "He/She is my partner", "audio": "audio/03-phrase-2.mp3"},
          {"spanish": "Buen partido", "english": "Good game", "audio": "audio/03-phrase-3.mp3"},
          {"spanish": "La pelota golpeó la red", "english": "The ball hit the net", "audio": "audio/03-phrase-4.mp3"},
          {"spanish": "Vamos a devolver el servicio", "english": "Let's return the serve", "audio": "audio/03-phrase-5.mp3"},
          {"spanish": "¿Dónde está la cancha?", "english": "Where is the court?", "audio": "audio/03-phrase-6.mp3"}
        ],
        "dialogue": {
          "context": "Teaching a beginner about the kitchen rule and court positions",
          "lines": [
            {"speaker": "A", "spanish": "Bienvenido a la cancha. ¿Es tu primer partido?", "english": "Welcome to the court. Is this your first game?"},
            {"speaker": "B", "spanish": "Sí, es mi primer partido. ¿Qué es la cocina?", "english": "Yes, it's my first game. What is the kitchen?"},
            {"speaker": "A", "spanish": "La cocina es esta zona cerca de la red. No puedes hacer una volea aquí.", "english": "The kitchen is this area near the net. You can't volley here."},
            {"speaker": "B", "spanish": "Entiendo. ¿Y tú eres mi pareja?", "english": "I understand. And you are my partner?"},
            {"speaker": "A", "spanish": "Sí, soy tu pareja. Ellos son nuestros oponentes.", "english": "Yes, I'm your partner. They are our opponents."},
            {"speaker": "B", "spanish": "¿Necesito una raqueta especial?", "english": "Do I need a special paddle?"},
            {"speaker": "A", "spanish": "No, cualquier raqueta está bien. La pelota es diferente del tenis.", "english": "No, any paddle is fine. The ball is different from tennis."},
            {"speaker": "B", "spanish": "Perfecto. ¿Quién va a servir primero?", "english": "Perfect. Who is going to serve first?"},
            {"speaker": "A", "spanish": "Yo voy a servir. Tú vas a devolver desde el otro lado.", "english": "I'm going to serve. You will return from the other side."},
            {"speaker": "B", "spanish": "¡Listo! Vamos a jugar.", "english": "Ready! Let's play."}
          ]
        },
        "quiz": [
          {"question": "What is 'la cocina' in pickleball?", "options": ["The serving area", "The no-volley zone", "The back court"], "correct": 1},
          {"question": "How do you say 'the ball' in Spanish?", "options": ["La pelota", "El pelota", "Las pelotas"], "correct": 0},
          {"question": "What does 'Es mi pareja' mean?", "options": ["It's my point", "He/She is my partner", "It's my serve"], "correct": 1},
          {"question": "What is 'devolver' in English?", "options": ["To serve", "To return", "To volley"], "correct": 1},
          {"question": "What can't you do in 'la cocina'?", "options": ["Serve", "Volley", "Stand"], "correct": 1}
        ]
      }
    ];

    // Audio player
    let currentAudio = null;

    function playAudio(audioPath) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      currentAudio = new Audio(audioPath);
      currentAudio.play().catch(err => {
        console.log('Audio file not found (audio not generated yet):', audioPath);
      });
    }

    // Render lessons
    function renderLessons() {
      const container = document.getElementById('lessons-container');

      lessons.forEach(lesson => {
        const lessonCard = document.createElement('div');
        lessonCard.className = 'lesson-card';

        let html = `
          <div class="lesson-header">
            <div class="lesson-title">Lesson ${lesson.id}: ${lesson.title}</div>
            <div class="lesson-subtitle">${lesson.vocabulary.length} words • ${lesson.phrases.length} phrases • ${lesson.dialogue.lines.length} dialogue lines</div>
          </div>

          <div class="section">
            <h3 class="section-title">Vocabulary</h3>
            <div class="vocab-grid">
        `;

        lesson.vocabulary.forEach(item => {
          html += `
            <div class="vocab-item">
              <div class="spanish-text">${item.spanish}</div>
              <div class="english-text">${item.english}</div>
              <button class="audio-button" onclick="playAudio('${item.audio}')">▶</button>
            </div>
          `;
        });

        html += `
            </div>
          </div>

          <div class="section">
            <h3 class="section-title">Example Phrases</h3>
        `;

        lesson.phrases.forEach(item => {
          html += `
            <div class="phrase-item">
              <div class="spanish-text">${item.spanish}</div>
              <div class="english-text">${item.english}</div>
              <button class="audio-button" onclick="playAudio('${item.audio}')">▶</button>
            </div>
          `;
        });

        html += `
          </div>

          <div class="section">
            <h3 class="section-title">Dialogue</h3>
            <div class="context-note">Context: ${lesson.dialogue.context}</div>
        `;

        lesson.dialogue.lines.forEach(line => {
          html += `
            <div class="dialogue-line">
              <div class="dialogue-speaker">Speaker ${line.speaker}</div>
              <div class="spanish-text">${line.spanish}</div>
              <div class="english-text">${line.english}</div>
            </div>
          `;
        });

        html += `
          </div>

          <div class="section">
            <h3 class="section-title">Quick Quiz</h3>
        `;

        lesson.quiz.forEach((q, idx) => {
          html += `
            <div class="quiz-question">
              <div class="quiz-question-text">${idx + 1}. ${q.question}</div>
              <div class="quiz-options">
          `;

          q.options.forEach((opt, optIdx) => {
            const isCorrect = optIdx === q.correct ? 'correct' : '';
            html += `<div class="quiz-option ${isCorrect}">${opt} ${isCorrect ? '✓' : ''}</div>`;
          });

          html += `
              </div>
            </div>
          `;
        });

        html += `</div>`;

        lessonCard.innerHTML = html;
        container.appendChild(lessonCard);
      });
    }

    // Initialize
    renderLessons();
  </script>
</body>
</html>

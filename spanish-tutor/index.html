<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish Tutor - Pickleball Edition</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header with Timer and Progress -->
  <header class="app-header">
    <div class="header-top">
      <h1 id="lesson-title">Loading...</h1>
      <div id="timer-display">0:00</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-bar-fill" style="width: 0%"></div>
        <div class="progress-text">0 minutes until unlock</div>
      </div>
      <div id="streak-display">🔥 0 day streak</div>
    </div>
  </header>

  <!-- Vocabulary Section -->
  <section id="vocabulary-section" class="lesson-content">
    <h2>Vocabulary</h2>
    <!-- Populated by app.js -->
  </section>

  <!-- Phrases Section -->
  <section id="phrases-section" class="lesson-content">
    <h2>Example Phrases</h2>
    <!-- Populated by app.js -->
  </section>

  <!-- Dialogue Section -->
  <section id="dialogue-section" class="lesson-content">
    <h2>Dialogue</h2>
    <!-- Populated by app.js -->
  </section>

  <!-- Quiz Section -->
  <section id="quiz-section" class="lesson-content">
    <h2>Quick Quiz</h2>
    <!-- Populated by app.js -->
  </section>

  <!-- Lesson Navigation -->
  <div class="lesson-nav">
    <button id="prev-lesson">← Previous</button>
    <button id="next-lesson">Complete Lesson →</button>
  </div>

  <!-- Scripts -->
  <script src="js/progress.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/audio-player.js"></script>
  <script src="js/unlock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
